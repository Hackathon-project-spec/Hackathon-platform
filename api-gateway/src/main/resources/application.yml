server:
  port: 9000

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://config-server:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/events/**
        - id: team-service
          uri: lb://team-service
          predicates:
            - Path=/api/teams/**,/api/invites/**
        - id: submission-service
          uri: lb://submission-service
          predicates:
            - Path=/api/submissions/**,/api/gallery/**
        - id: judging-service
          uri: lb://judging-service
          predicates:
            - Path=/api/judging/**,/api/rubrics/**,/api/scores/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/hackathon}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
eureka:
  client:
    enabled: false
